name: generate snake

on:
  schedule:
    - cron: "23 3 * * *" # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: cookabc
          outputs: |
            dist/snake-dark.svg?color_snake=%234CCCE6&color_dots=%23082C36,%23045A6E,%23008396,%2300A2C7,%234CCCE6
            dist/snake-light.svg?color_snake=%2300749E&color_dots=%23A9DAED,%2376BFD8,%234CA0C1,%23287F9E,%2300749E
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
